<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d131a" />
  <title>Campaign Trail | South African Political Canvassing Game</title>
  <meta name="description" content="A satirical, fun South African political canvassing game. Run through neighbourhoods, listen to community complaints, and win votes!" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d131a;
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
      position: fixed;
      inset: 0;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      inset: 0;
      background-color: #0d131a;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    /* Mobile Portrait Hint */
    #portrait-hint {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(13, 19, 26, 0.95);
      z-index: 9999;
      color: #ffffff;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(8px);
    }
    #portrait-hint .icon {
      font-size: 56px;
      margin-bottom: 16px;
      animation: rotatePhone 2.2s infinite ease-in-out;
    }
    #portrait-hint h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #fcb813;
      margin-bottom: 8px;
    }
    #portrait-hint p {
      font-size: 15px;
      color: #cbd5e1;
      max-width: 320px;
      line-height: 1.5;
    }
    @keyframes rotatePhone {
      0%, 20% { transform: rotate(0deg); }
      50%, 70% { transform: rotate(90deg); }
      90%, 100% { transform: rotate(0deg); }
    }
    @media (max-width: 820px) and (orientation: portrait) {
      #portrait-hint.active {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="portrait-hint" class="active">
    <div class="icon">📱🔄</div>
    <h2>Rotate for the Campaign Trail</h2>
    <p>For the ultimate experience, rotate your phone to <strong>Landscape mode</strong>!</p>
    <button id="dismiss-hint" style="margin-top: 20px; background: #1f9137; border: 2px solid #2ecc71; color: #ffffff; font-family: Outfit, sans-serif; font-size: 15px; font-weight: 800; padding: 10px 24px; border-radius: 25px; cursor: pointer;">
      Play in Portrait Anyway ➔
    </button>
  </div>
  <script>
    document.getElementById('dismiss-hint')?.addEventListener('click', function() {
      document.getElementById('portrait-hint')?.classList.remove('active');
      document.getElementById('portrait-hint').style.display = 'none';
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
